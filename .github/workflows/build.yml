name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m unittest discover -s tests -t . -v

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
          pip install pyinstaller
      - name: Build Linux binary
        run: pyinstaller --noconfirm packaging/pyinstaller/squareroot.spec
      - name: Smoke-test binary (must still be running after 5s)
        run: |
          set +e
          xvfb-run -a timeout 5 dist/SquareRoot
          [ $? -eq 124 ]
      - run: mv dist/SquareRoot dist/SquareRoot-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/SquareRoot-linux-x86_64

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyinstaller
      - run: pyinstaller --noconfirm packaging/pyinstaller/squareroot.spec
      - run: Rename-Item dist/SquareRoot.exe SquareRoot-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/SquareRoot-windows-x86_64.exe

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyinstaller
      - run: pyinstaller --noconfirm packaging/pyinstaller/squareroot.spec
      - name: Create .dmg
        run: |
          hdiutil create -volname SquareRoot -srcfolder dist/SquareRoot.app \
            -ov -format UDZO dist/SquareRoot-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/SquareRoot-macos.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
